# Windows installer and update feed for the SwarmUp desktop app, swarmupd and the swarmup command.
# Build: npm run dist (stages release/app with scripts/package.mjs, then runs electron-builder).
appId: tech.swarmup.app
productName: SwarmUp
# electron is a devDependency with a range; pin the version actually installed so the build
# does not depend on electron-builder's probe in an npm workspace.
electronVersion: 45.2.1
directories:
  # The staged app: bundles only, no node_modules.
  app: release/app
  output: release/dist
  buildResources: build
# No asar: swarmupd and the swarmup command run the bundles from this folder with the app's executable
# as Node (ELECTRON_RUN_AS_NODE), and they are plain files there.
asar: false
# The bundles carry their dependencies; the desktop package's node_modules are not needed.
files:
  - '**/*'
  - '!node_modules{,/**/*}'
extraResources:
  - from: release/bin
    to: bin
  - from: build/path.ps1
    to: path.ps1
win:
  target:
    - nsis
  icon: build/icon.ico
  # Signing reads CSC_LINK and CSC_KEY_PASSWORD from the environment; without them the build is
  # unsigned. Checking update signatures needs a signed build (and electron-builder's winCodeSign
  # bundle, which needs symlink rights to extract), so it is off until signing is set up.
  verifyUpdateCodeSignature: false
nsis:
  # A fixed GUID: the one the first beta installers used. It names the uninstall entry and the
  # install record, so every installer sees an earlier install as an older version of itself: it
  # runs the old uninstaller (keeping user data and PATH), installs into the same folder and
  # renames the shortcuts. Without it, an update would leave two installed apps. Never change it.
  guid: 0ee0268e-4046-5200-afd1-f92ff0ba7291
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SwarmUp
  runAfterFinish: true
  include: build/installer.nsh
  # The four tiles: the sidebar (164 x 314) on the welcome and finish pages of the installer and
  # the uninstaller, the header (150 x 57) on the pages between.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  # A fixed name, so the README can link releases/latest/download/SwarmUp-Setup.exe.
  artifactName: SwarmUp-Setup.${ext}
publish:
  provider: github
  owner: dawid-ai
  # Installed apps read latest.yml from the newest release of this repository.
  repo: swarmup
  # A draft is invisible to electron-updater.
  releaseType: release
